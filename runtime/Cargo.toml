[workspace]
resolver = "2"
members = [
    "core",
    "ir",
    "models",
    "scheduler",
    "state",
    "workers",
    "api",
    "telemetry",
    "timers",
    "policy",
    "agents",
    "audit",
    "engram",
    "engram-server",
    "protocols",
    "protocols/mcp",
    "protocols/a2a",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jamjet-labs/jamjet"
rust-version = "1.89"
homepage = "https://jamjet.dev"
documentation = "https://docs.jamjet.dev"
keywords = ["agent", "workflow", "mcp", "a2a", "llm"]
categories = ["development-tools", "asynchronous", "web-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "sqlite", "uuid", "chrono", "json"] }

# HTTP / gRPC
axum = { version = "0.7", features = ["json", "macros"] }
hyper = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "query", "rustls"] }

# Tracing / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["metrics", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
tracing-opentelemetry = "0.34"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# IDs and time
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"

# Config
config = "0.15"
dotenvy = "0.15"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Misc
futures = "0.3"
bytes = "1"
pin-project = "1"

# Crypto
sha2 = "0.11"
rand = "0.10"

# Static file embedding
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
