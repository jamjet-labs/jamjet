version: 2
updates:
  # Rust / Cargo
  - package-ecosystem: cargo
    directory: /runtime
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # These crates pass each other's types, so one bumped alone does not
      # compile (#148, #151, #152, #153 all failed that way). Each group moves
      # in one PR, major bumps included. A crate goes to the first group it
      # matches, so these come before the catch-all.
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
      rustcrypto-digests:
        patterns: ["sha2", "hmac", "digest"]
      patch-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # engram/Cargo.toml pins ort to one exact release candidate, because
      # the rcs change API between each other. A newer rc lands in the
      # patch-updates group and fails the whole PR, which holds back the
      # other crates in it (#206: rc.15 changed Session::builder and needs
      # Rust 1.92). Only versions below 2.0.0 are ignored, so the stable
      # release is still proposed when it ships.
      - dependency-name: "ort"
        versions: ["<2.0.0"]

  # Python SDK
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # The model extra caps litellm on purpose (the reason is beside the
      # bound in sdk/python/pyproject.toml). For a range, Dependabot can only
      # propose raising the bound, and test_packaging_metadata.py fails every
      # such PR (#205). The same test file fails if this entry outlives the
      # bound.
      - dependency-name: "litellm"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
