name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so main is checked against a new stable toolchain, new advisories
  # and fresh Python resolves even in a week with no pushes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege for the whole workflow. Every job here reads the repo, builds,
# and reports — none of them writes to it, so none needs the default write-capable
# token. Declared once at the top rather than per job, so a job added later
# inherits the floor instead of silently getting write.
#
# Publishing is unaffected: the release workflows are separate files and keep
# their own `id-token: write` for OIDC.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust ────────────────────────────────────────────────────────────
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
      - name: Create web/dist placeholder for rust-embed
        run: mkdir -p ../web/dist && echo '<!DOCTYPE html><html><body></body></html>' > ../web/dist/index.html
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Any warning fails the job, tests and the optional features included.
        # A new stable clippy can add lints that flag existing code; the weekly
        # scheduled run shows that on main instead of on an unrelated PR.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
      - name: Create web/dist placeholder for rust-embed
        run: mkdir -p ../web/dist && echo '<!DOCTYPE html><html><body></body></html>' > ../web/dist/index.html
      - name: Test
        run: cargo test --workspace --locked

  # The jobs above build with default features, so engram's `rerank` (ONNX
  # Runtime through `ort`) is otherwise compiled only by clippy and never run.
  rust-test-all-features:
    name: Rust tests (all features)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
          key: all-features
      - name: Create web/dist placeholder for rust-embed
        run: mkdir -p ../web/dist && echo '<!DOCTYPE html><html><body></body></html>' > ../web/dist/index.html
      - name: Test
        run: cargo test --workspace --all-features --locked

  # `rust-version` in runtime/Cargo.toml is what crates.io users are told they
  # need. Build on exactly that toolchain, read from the manifest so the two
  # cannot drift apart.
  rust-msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "::error::no rust-version in runtime/Cargo.toml"
            exit 1
          fi
          echo "rust-version=$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
          key: msrv
      - name: Create web/dist placeholder for rust-embed
        run: mkdir -p ../web/dist && echo '<!DOCTYPE html><html><body></body></html>' > ../web/dist/index.html
      - name: Check on the declared rust-version
        env:
          # Overrides rust-toolchain.toml, which asks for stable.
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          case "$(rustc --version)" in
            "rustc $MSRV."* | "rustc $MSRV "*) ;;
            *) echo "::error::expected rustc $MSRV, got $(rustc --version)"; exit 1 ;;
          esac
          cargo check --workspace --all-targets --all-features --locked

  # ── Python SDK ──────────────────────────────────────────────────────
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # mypy is scoped to jamjet.cloud (the actively-maintained surface).
      # Framework-level type issues in jamjet/llm/* and similar legacy modules
      # are tracked separately; treating them as CI blockers would prevent any
      # cloud-related PR from merging.
      - run: uv run mypy jamjet/cloud

  python-test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor (requires-python) through the newest version we support.
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    env:
      # Make uv build the venv on this leg's interpreter, not one it finds first.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install uv
      - run: uv sync --all-extras
      - run: uv run python -c "import sys; print(sys.version)"
      - run: uv run pytest --tb=short --durations=10

  # Install jamjet[model] the way a user does, with no lockfile, so CI tests the
  # versions a fresh `pip install` really resolves. Then run the agent
  # `jamjet create` scaffolds (against a stub Anthropic API) and the FastMCP
  # example in the same environment.
  python-first-run:
    name: Python first run (no lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install jamjet[model] and the MCP example's requirements
        run: |
          python -m venv /tmp/firstrun
          /tmp/firstrun/bin/pip install --upgrade pip
          /tmp/firstrun/bin/pip install "./sdk/python[model]" -r examples/05-mcp-tool-call/requirements.txt
          /tmp/firstrun/bin/pip list | grep -iE "^(jamjet|litellm|mcp) "
      - name: Run the scaffolded agent against a stub provider
        run: |
          python .github/scripts/stub_model_provider.py 8765 &
          for i in $(seq 1 20); do curl -s -o /dev/null -X POST -d '{}' http://127.0.0.1:8765/v1/messages && break; sleep 0.5; done
          cd /tmp && /tmp/firstrun/bin/jamjet create firstrun-agent
          cd /tmp/firstrun-agent
          ANTHROPIC_API_BASE=http://127.0.0.1:8765 ANTHROPIC_API_KEY=stub /tmp/firstrun/bin/python agent.py | tee out.txt
          grep -q "42" out.txt
      - name: Run examples/05-mcp-tool-call (FastMCP, mcp 1.x)
        working-directory: examples/05-mcp-tool-call
        run: /tmp/firstrun/bin/python main.py

  # ── Java SDK ────────────────────────────────────────────────────────
  java-test:
    name: Java SDK tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn test -q --no-transfer-progress

  # The Java client against a REAL runtime built from this commit. Unit tests pin
  # each call's path and body; this proves the runtime agrees, by asserting what the
  # runtime reports back (stored IDs, status, events), not only that nothing threw.
  # Actions are SHA-pinned.
  java-runtime-contract:
    name: Java SDK contract (real runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runtime -> target
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Create web/dist placeholder for rust-embed
        run: mkdir -p web/dist && echo '<!DOCTYPE html><html><body></body></html>' > web/dist/index.html
      - name: Build runtime
        working-directory: runtime
        run: cargo build -p jamjet-api --bin jamjet-server --locked
      - name: Start runtime in dev mode
        run: |
          mkdir -p "$RUNNER_TEMP/jamjet"
          cd "$RUNNER_TEMP/jamjet"
          JAMJET_DEV_MODE=true JAMJET_PORT=7700 \
            nohup "$GITHUB_WORKSPACE/runtime/target/debug/jamjet-server" > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:7700/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Contract test
        working-directory: sdk/java
        run: >-
          mvn -B --no-transfer-progress -pl jamjet-sdk -am -P runtime-contract verify
          -Dgpg.skip -Djamjet.runtime.url=http://127.0.0.1:7700
      - name: Runtime log
        if: failure()
        run: cat "$RUNNER_TEMP/jamjet/server.log"

  # ── Security audit ──────────────────────────────────────────────────
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: |
          # --deny unsound: fail on CVEs/unsound advisories (not on unmaintained warnings)
          # --ignore RUSTSEC-2023-0071: rsa Marvin Attack — no upstream fix available yet;
          #   we use rsa only as a transitive dep of sqlx, not for key operations.
          #   This is the ONLY suppression. RUSTSEC-2026-0258 was dropped in #115 when
          #   the OTLP stack moved to opentelemetry 0.32 / tonic 0.14, taking hyper 0.14
          #   and h2 0.3.x out of the tree.
          cargo audit --deny unsound \
            --ignore RUSTSEC-2023-0071

      # Guard the fix rather than the exception: the vulnerable line must not
      # return through a future dependency bump. `cargo audit` alone would not
      # catch a REINTRODUCED hyper 0.14 while some other crate still satisfied
      # the advisory, and h2 0.3.x arriving anywhere is a regression regardless.
      - name: Assert the pre-1.x hyper line stays out of the tree
        working-directory: runtime
        run: |
          for spec in "h2@0.3" "hyper@0.14"; do
            if cargo tree --workspace --invert "$spec" 2>/dev/null | grep -q .; then
              echo "::error::$spec is back in the dependency tree (see #115)."
              cargo tree --workspace --invert "$spec"
              exit 1
            fi
          done
          echo "clean: no h2 0.3.x, no hyper 0.14"

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install uv pip-audit
      - run: uv sync --all-extras
      - name: Audit dependencies
        run: |
          # Ignored vulns (re-evaluate periodically):
          #   CVE-2026-4539 — pygments AdlLexer regex DoS, no upstream fix.
          #   CVE-2026-3219 — pip tar/zip handling; pip is a build-time tool, not
          #     a runtime dep. We upgrade pip above to mitigate, and ignore here so
          #     the audit doesn't fail on pip-audit's own venv pinning.
          pip-audit --desc \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-3219

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # pull_request: compare PR base SHA to PR head SHA
          # push: compare previous SHA to current SHA (fallback to parent of HEAD)
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || format('{0}^', github.sha)) }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  # ── Build check ─────────────────────────────────────────────────────
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
      - name: Create web/dist placeholder for rust-embed
        run: mkdir -p ../web/dist && echo '<!DOCTYPE html><html><body></body></html>' > ../web/dist/index.html
      - run: cargo build --release --workspace --locked

  # ── Wheel build check ───────────────────────────────────────────────
  wheel-check:
    name: Wheel build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build wheel
        run: python -m build --wheel
        working-directory: sdk/python
      - name: Smoke-test wheel installs
        run: |
          pip install sdk/python/dist/*.whl
          jamjet --help
