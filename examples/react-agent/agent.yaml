# examples/react-agent/agent.yaml
#
# ReAct Agent — Reasoning + Acting loop compiled to a durable JamJet DAG.
#
# The agent follows the ReAct pattern (Yao et al. 2022):
#   Thought → Tool Call → Observation → Thought → ... → Final Answer
#
# JamJet compiles this to a static DAG with:
#   - One think/observe pair per iteration (up to max_iterations)
#   - Cost guards after every iteration (max_cost_usd)
#   - Workflow-level timeout (timeout_seconds)
#   - LIMIT_EXCEEDED terminal state if any limit is hit
#
# Prerequisites:
#   export ANTHROPIC_API_KEY="sk-ant-..."
#   The tools listed below registered as @tool functions on a running
#   `jamjet worker` (see examples/react-agent-durable for a worker setup).
#
# Check the definition (no runtime needed):
#   jamjet validate agent.yaml
#
# Running it:
#   In this release a model node writes its output only to
#   state.last_model_output, while this strategy's later steps read their own
#   per-step keys, so a run stops at the first step that reads one. Use this
#   file with `jamjet validate`.

agent:
  id: react_researcher
  version: 0.1.0
  name: "ReAct research agent"

  strategy: react

  model: claude-sonnet-4-6

  goal: |
    {{ state.goal }}

    Use the available tools to gather information. Think step by step.
    When you have enough information to answer fully, call the `finish` tool.

  # Tools available to the agent in each iteration: the names of @tool
  # functions, which carry their own descriptions and input schemas.
  tools: [web_search, fetch_url, finish]

  # Hard limits, enforced by compiled cost-guard nodes in the DAG. When one is
  # hit the run ends in the LIMIT_EXCEEDED state.
  limits:
    max_iterations: 6
    max_cost_usd: 0.50
    timeout_seconds: 120
