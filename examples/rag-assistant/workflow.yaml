# examples/rag-assistant/workflow.yaml
#
# RAG Assistant: a retrieval-augmented generation pipeline.
#
# Pattern: fetch documents via MCP -> pick the relevant chunks -> answer with Claude.
#
# Prerequisites:
#   An MCP docs server reachable at the URL under mcp.servers.docs below
#   (change it to yours), exposing a `search_documents` tool.
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# Check the definition (no runtime needed):
#   jamjet validate workflow.yaml
#
# Run:
#   jamjet dev
#   jamjet run workflow.yaml --input '{"question": "What is JamJet?"}'

workflow:
  id: rag_assistant
  version: 0.1.0
  description: "Retrieval-augmented generation: fetch docs, retrieve chunks, answer with an LLM"
  start: fetch_docs

  state_schema:
    type: object
    properties:
      question: { type: string }
    required: [question]

mcp:
  servers:
    docs:
      transport: http_sse
      url: "http://localhost:8080/mcp"
      args: []

nodes:
  # Step 1: fetch documents from the MCP docs server.
  fetch_docs:
    type: mcp_tool
    description: Fetch documents from the MCP docs server
    server: docs
    tool: search_documents
    input:
      query: "{{ state.question }}"
    timeout: 30s
    retry_policy: io_default
    next: retrieve_chunks

  # Step 2: keep the most relevant chunks (a registered Python tool).
  retrieve_chunks:
    type: tool
    description: Retrieve the top-k relevant chunks
    tool_ref: retrieve_top_chunks
    input:
      query: "{{ state.question }}"
    next: answer_question

  # Step 3: answer with Claude, grounded in the retrieved context.
  answer_question:
    type: model
    description: Answer the question with the retrieved context
    model: claude-sonnet-4-6
    system_prompt: |
      You are a helpful assistant. Answer the user's question using ONLY
      the provided context. If the context does not contain the answer,
      say "I don't have enough information to answer that."
    prompt: |
      Question: {{ state.question }}
    next: end
