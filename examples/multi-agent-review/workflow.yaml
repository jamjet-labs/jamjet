# examples/multi-agent-review/workflow.yaml
#
# Multi-Agent Review: a coordinator workflow sends an artifact to specialist
# reviewer agents over A2A, then a model synthesises their findings.
#
# Architecture:
#   Coordinator (this workflow)
#     -> Security Reviewer    (external A2A agent)
#     -> Performance Reviewer (external A2A agent)
#     -> Compliance Reviewer  (external A2A agent)
#   -> Synthesiser (model node)
#
# Prerequisites:
#   Three A2A reviewer agents at the URLs under a2a.remote_agents below
#   (change them to yours).
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# Check the definition (no runtime needed):
#   jamjet validate workflow.yaml
#
# Running it:
#   The engine in this release has no executor for a2a_task nodes and refuses
#   to register a workflow that uses them, so `jamjet run` stops there. Use
#   this file with `jamjet validate`.

workflow:
  id: multi_agent_review
  version: 0.1.0
  description: "Send an artifact to specialist A2A reviewer agents, then synthesise the results"
  start: security_review

  state_schema:
    type: object
    properties:
      artifact_url: { type: string }
    required: [artifact_url]

a2a:
  remote_agents:
    security_reviewer:
      url: "https://security-agent.example.com"
    perf_reviewer:
      url: "https://perf-agent.example.com"
    compliance_reviewer:
      url: "https://compliance-agent.example.com"

nodes:
  # Each reviewer leg delegates to a specialist A2A agent.
  security_review:
    type: a2a_task
    description: Delegate to the security reviewer agent
    remote_agent: security_reviewer
    skill: review_security
    input:
      artifact_url: "{{ state.artifact_url }}"
    next: perf_review

  perf_review:
    type: a2a_task
    description: Delegate to the performance reviewer agent
    remote_agent: perf_reviewer
    skill: review_performance
    input:
      artifact_url: "{{ state.artifact_url }}"
    next: compliance_review

  compliance_review:
    type: a2a_task
    description: Delegate to the compliance reviewer agent
    remote_agent: compliance_reviewer
    skill: review_compliance
    input:
      artifact_url: "{{ state.artifact_url }}"
    next: synthesise

  # The coordinator synthesises the findings into a final report.
  synthesise:
    type: model
    description: Synthesise all review findings
    model: claude-sonnet-4-6
    system_prompt: |
      You are a senior engineering lead. Given findings from three specialist
      reviewers, synthesise them into a concise, prioritised final report
      (executive summary + action items).
    prompt: |
      Artifact: {{ state.artifact_url }}
      Summarise the security, performance and compliance findings.
    next: end
