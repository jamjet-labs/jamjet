# examples/a2a-delegation/workflow.yaml
#
# A2A Delegation: delegate a sub-task to a remote A2A agent and bring its
# result back into the parent workflow.
#
# The workflow:
#   1. Prepares a task brief with a model
#   2. Delegates the research to a specialist A2A agent
#   3. Streams progress from the remote agent
#   4. Formats the remote result into a report
#
# Prerequisites:
#   A research agent that speaks A2A at the URL under a2a.remote_agents below
#   (change it to yours, or run the a2a-server template locally).
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# Check the definition (no runtime needed):
#   jamjet validate workflow.yaml
#
# Run:
#   jamjet dev
#   jamjet run workflow.yaml \
#     --input '{"topic": "Impact of LLMs on software engineering", "depth": "detailed"}'
#   jamjet run workflow.yaml --stream   # progressive output

workflow:
  id: a2a_delegation
  version: 0.1.0
  description: "A coordinator delegates research to a specialist A2A agent, then formats the result"
  start: prepare_brief

  state_schema:
    type: object
    properties:
      topic: { type: string }
      depth: { type: string, enum: [brief, detailed], default: brief }
    required: [topic]

a2a:
  remote_agents:
    research_agent:
      url: "http://localhost:8080"

nodes:
  # Step 1: the coordinator prepares a structured brief for the specialist.
  prepare_brief:
    type: model
    description: Prepare a research brief for the specialist agent
    model: claude-haiku-4-5-20251001
    system_prompt: |
      You produce structured research briefs. Given a topic and depth level,
      produce a clear brief that a specialist research agent can act on.
      Include: objectives, key questions to answer, desired output format.
    prompt: |
      Topic: {{ state.topic }}
      Depth: {{ state.depth }}
    next: delegate_research

  # Step 2: delegate the research task to the A2A agent and stream its progress.
  delegate_research:
    type: a2a_task
    description: Delegate research to the specialist A2A agent
    remote_agent: research_agent
    skill: conduct_research
    input:
      topic: "{{ state.topic }}"
      depth: "{{ state.depth }}"
    stream: true
    timeout: 300s
    next: format_report

  # Step 3: the coordinator formats the specialist's result into a report.
  format_report:
    type: model
    description: Format the research result into a final report
    model: claude-sonnet-4-6
    system_prompt: |
      You are a technical writer. Format the raw research result into a
      clean, well-structured report suitable for a business audience.
      Include: executive summary, key findings, recommendations.
    prompt: |
      Topic: {{ state.topic }}
      Format the research result into the final report.
    next: end
