# examples/hitl-approval/workflow.yaml
#
# Human-in-the-loop approval: a model assesses the risk of a request, a human
# approves or rejects it, and only an approved request is acted on.
#
# Pattern: assess risk -> pause for human review -> act on the decision.
#
# Prerequisites:
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# Check the definition (no runtime needed):
#   jamjet validate workflow.yaml
#
# Run:
#   jamjet dev
#   jamjet run workflow.yaml --input '{"request": "Approve $50k budget for Q3 infra."}'
#
# Decide on the paused approval:
#   jamjet approvals <exec-id>
#   jamjet approve <exec-id> --decision approved --comment "Looks good"
#   jamjet approve <exec-id> --decision rejected --comment "Needs CFO sign-off first"

workflow:
  id: hitl_approval
  version: 0.1.0
  description: "A model assesses a request's risk; a human approves or rejects it before any action is taken"
  start: assess_risk

  state_schema:
    type: object
    properties:
      request: { type: string }
    required: [request]

nodes:
  # Step 1: the model analyses the request and produces a risk assessment.
  assess_risk:
    type: model
    description: Assess the risk of the request
    model: claude-sonnet-4-6
    system_prompt: |
      You are a risk assessment assistant. Given a business request, produce:
      1. A brief risk assessment (2-3 sentences).
      2. A risk level: low, medium, or high.

      Respond in JSON: {"risk_assessment": "...", "risk_level": "low|medium|high"}
    prompt: "Request: {{ state.request }}"
    next: await_approval

  # Step 2: pause until a human approves or rejects. A rejection stops the run
  # here, so the action below only ever runs on an approved request.
  await_approval:
    type: human_approval
    description: Review the request and its risk assessment, then approve or reject
    timeout: 24h
    next: take_action

  # Step 3: the approved request is executed by a registered tool.
  take_action:
    type: tool
    description: Execute the approved request
    tool_ref: execute_request
    input:
      request: "{{ state.request }}"
    next: end
