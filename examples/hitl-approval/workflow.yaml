# examples/hitl-approval/workflow.yaml
#
# Human-in-the-loop approval: a model assesses the risk of a request, a human
# approves or rejects it, and only an approved request goes on.
#
# Approving continues the run; rejecting fails it. If nobody decides within 24
# hours, the approval goes to a second approver; if that one also expires, the
# run fails. Nothing is approved automatically.
#
# Prerequisites:
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# Check the definition (no runtime needed):
#   jamjet validate workflow.yaml
#
# Run:
#   jamjet dev
#   jamjet run workflow.yaml --input '{"request": "Approve $50k budget for Q3 infra."}'
#
# Decide on the paused approval:
#   jamjet approvals <exec-id>
#   jamjet approve <exec-id> --decision approved --comment "Looks good"
#   jamjet approve <exec-id> --decision rejected --comment "Needs CFO sign-off first"

workflow:
  id: hitl_approval
  version: 0.1.0
  description: "A model assesses a request's risk; a human approves or rejects it before anything else happens"
  start: assess_risk

  state_schema:
    type: object
    properties:
      request: { type: string }
    required: [request]

nodes:
  # Step 1: the model analyses the request and produces a risk assessment.
  assess_risk:
    type: model
    description: Assess the risk of the request
    model: claude-sonnet-4-6
    system_prompt: |
      You are a risk assessment assistant. Given a business request, produce:
      1. A brief risk assessment (2-3 sentences).
      2. A risk level: low, medium, or high.
    prompt: "Request: {{ state.request }}"
    next: await_approval

  # Step 2: pause until a human approves or rejects.
  await_approval:
    type: human_approval
    description: Review the request and its risk assessment, then approve or reject
    timeout: 24h
    fallback: escalate
    next: confirm

  # Reached only if the first approver lets the deadline pass.
  escalate:
    type: human_approval
    description: "Escalated: the first approver did not decide within 24 hours"
    timeout: 24h
    next: confirm

  # Step 3: the approved request is written up for the requester.
  confirm:
    type: model
    description: Confirm the approved request
    model: claude-sonnet-4-6
    prompt: |
      This request was approved: {{ state.request }}

      Risk assessment:
      {{ state.last_model_output }}

      Write a short confirmation for the requester.
    next: end
