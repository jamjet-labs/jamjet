# A scripted model: find a venue, check its dates, pay a small
# deposit, answer.
turns:
  - tool_calls:
      - name: search_venues
        arguments: {city: Lisbon, date: "2026-12-11"}
  - tool_calls:
      - name: check_dates
        arguments: {venue: Casa do Rio}
  - tool_calls:
      - name: pay_small_deposit
        arguments: {venue: Casa do Rio, amount: 200}
  - content: >-
      Booked Casa do Rio in Lisbon for 11 December.
      The 200 deposit is paid.
